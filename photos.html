<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos | Your Lab Name</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="site-header"></header>
  <div class="page-title"><div class="container"><h1>Photos</h1><p>Fieldwork, lab life, and events.</p></div></div>

  <section>
    <div class="container">
      <div class="grid">
        <figure class="card" style="margin:0"><div class="photo">Photo 1</div><div class="card-body"><p>Caption</p></div></figure>
        <figure class="card" style="margin:0"><div class="photo">Photo 2</div><div class="card-body"><p>Caption</p></div></figure>
        <figure class="card" style="margin:0"><div class="photo">Photo 3</div><div class="card-body"><p>Caption</p></div></figure>
        <figure class="card" style="margin:0"><div class="photo">Photo 4</div><div class="card-body"><p>Caption</p></div></figure>
      </div>
      <p class="note" style="margin-top:2rem">Put your images in an <code>images/</code> folder and swap each <code>&lt;div class="photo"&gt;</code> for <code>&lt;img src="images/your-photo.jpg" alt="..."&gt;</code>.</p>
    </div>
  </section>

  <footer id="site-footer"></footer>
  <script src="site.js"></script>
</body>
</html>
